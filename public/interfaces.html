<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>创客贴接口总览</title>
    <link rel="stylesheet" href="/interfaces.css" />
  </head>
  <body>
    <div class="noise"></div>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand-card">
          <p class="eyebrow">API ATLAS</p>
          <h1>创客贴后端接口总览</h1>
          <p class="brand-copy">一个页面看清当前后端全部接口、鉴权要求与示例参数。</p>
        </div>

        <div class="sidebar-panel">
          <label class="field-label" for="searchInput">检索接口</label>
          <input id="searchInput" class="search-input" type="search" placeholder="搜路径 / 方法 / 模块" />
        </div>

        <div class="sidebar-panel">
          <span class="field-label">按模块</span>
          <div id="groupFilters" class="filter-stack"></div>
        </div>

        <div class="sidebar-panel">
          <span class="field-label">按方法</span>
          <div id="methodFilters" class="filter-row"></div>
        </div>

        <div class="sidebar-panel compact">
          <div class="meta-line"><span>页面地址</span><code>/interfaces</code></div>
          <div class="meta-line"><span>数据来源</span><code>/api/docs/interfaces</code></div>
          <div class="meta-line"><span>统一响应</span><code>{ code, message, data }</code></div>
        </div>
      </aside>

      <main class="content">
        <header class="hero">
          <div>
            <p class="eyebrow">LIGHTWEIGHT EXPRESS DOCS</p>
            <h2>所有接口都在这里，直接可见。</h2>
          </div>
          <div class="hero-stats">
            <div class="stat-card">
              <span class="stat-label">接口数</span>
              <strong id="interfaceCount">--</strong>
            </div>
            <div class="stat-card">
              <span class="stat-label">模块数</span>
              <strong id="groupCount">--</strong>
            </div>
            <div class="stat-card">
              <span class="stat-label">需鉴权</span>
              <strong id="authCount">--</strong>
            </div>
          </div>
        </header>

        <section id="statusBanner" class="status-banner">正在加载接口数据...</section>
        <section id="interfaceSections" class="interface-sections"></section>
      </main>
    </div>

    <template id="interfaceCardTemplate">
      <article class="interface-card">
        <button class="interface-summary" type="button">
          <div class="summary-main">
            <span class="method-badge"></span>
            <div>
              <h3 class="interface-title"></h3>
              <code class="interface-path"></code>
            </div>
          </div>
          <div class="summary-side">
            <span class="auth-pill"></span>
            <span class="expand-indicator">查看详情</span>
          </div>
        </button>
        <div class="interface-detail">
          <p class="interface-description"></p>
          <div class="detail-actions">
            <button class="action-btn copy-link" title="复制接口链接">
              <span class="btn-icon">📋</span> 复制链接
            </button>
            <button class="action-btn test-api" title="测试接口">
              <span class="btn-icon">🧪</span> 测试接口
            </button>
          </div>
          <div class="test-result" style="display: none;"></div>
          <div class="detail-block body-block">
            <h4>请求体示例</h4>
            <pre class="code-block request-body"></pre>
          </div>
          <div class="detail-block">
            <h4>返回说明</h4>
            <p class="response-notes"></p>
          </div>
        </div>
      </article>
    </template>

    <!-- 测试接口弹窗 -->
    <div id="testModal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <h3>🧪 测试接口</h3>
          <button class="modal-close" onclick="closeTestModal()">✕</button>
        </div>
        <div class="modal-body">
          <div class="modal-info">
            <div class="info-row">
              <span class="info-label">接口：</span>
              <code id="modalPath"></code>
            </div>
            <div class="info-row">
              <span class="info-label">方法：</span>
              <span id="modalMethod" class="method-tag"></span>
            </div>
          </div>
          
          <div id="pathParamsSection" class="input-section" style="display: none;">
            <h4>路径参数</h4>
            <div id="pathParamsInputs" class="params-grid"></div>
          </div>
          
          <div id="queryParamsSection" class="input-section" style="display: none;">
            <h4>查询参数</h4>
            <div id="queryParamsInputs" class="params-grid"></div>
          </div>
          
          <div id="bodySection" class="input-section" style="display: none;">
            <h4>请求体 (JSON)</h4>
            <textarea id="bodyInput" class="body-textarea" placeholder="请输入 JSON 格式的请求体"></textarea>
          </div>
          
          <div id="authSection" class="input-section" style="display: none;">
            <h4>认证 Token</h4>
            <input id="authTokenInput" type="text" class="auth-input" placeholder="请输入 Bearer Token（不需要 Bearer 前缀）" />
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-secondary" onclick="closeTestModal()">取消</button>
          <button class="btn-primary" onclick="executeTest()">
            <span class="btn-icon">🚀</span> 发送请求
          </button>
        </div>
      </div>
    </div>

    <script src="/interfaces.js"></script>
  </body>
</html>
